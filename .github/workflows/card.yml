name: Update profile card

on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [profile.toml, portrait.txt, build.py, assets/**]

permissions:
  contents: write

concurrency:
  group: card
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Render SVGs
        env:
          GH_TOKEN: ${{ secrets.PROFILE_TOKEN || github.token }}
        run: python build.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add card-dark.svg card-light.svg card.md cache/stats.json
          git diff --cached --quiet || git commit -m "Update profile card"
          git push
